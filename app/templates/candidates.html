<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Directory - AI HR Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans pb-12">
    <nav class="border-b border-slate-800 bg-slate-950 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-400">🤖 AI HR Recruitment Assistant</h1>
            <a href="/" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-3 py-1.5 rounded-lg transition">
                + Upload New Resume
            </a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-8 px-4">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-3xl font-bold text-slate-100">Candidate Directory</h2>
                <p class="text-slate-400 text-sm">Manage and evaluate all analyzed applicants</p>
            </div>
        </div>

        <!-- Search Input Bar -->
        <div class="mb-6">
            <input type="text" id="searchInput" oninput="filterCandidates()" placeholder="Search candidates by name, email, or skills... (Press Enter or type)" 
                   class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <!-- Loading state -->
        <div id="loader" class="text-center my-12 text-indigo-400 animate-pulse">
            ⏳ Loading directory candidates...
        </div>

        <!-- Candidates Grid Container -->
        <div id="candidateGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

        <!-- Empty Results State -->
        <div id="emptyState" class="hidden text-center my-12 text-slate-500">
            No candidates found matching your search.
        </div>
    </div>

    <script>
        let allCandidates = [];

        async function loadCandidates() {
            try {
                const res = await fetch('/api/candidates');
                if (!res.ok) throw new Error("Failed to load candidates");
                
                allCandidates = await res.json();
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('candidateGrid').classList.remove('hidden');
                
                renderCandidates(allCandidates);
            } catch (err) {
                console.error(err);
                document.getElementById('loader').textContent = "❌ Failed to load candidates from database.";
            }
        }

        function renderCandidates(candidates) {
            const grid = document.getElementById('candidateGrid');
            const emptyState = document.getElementById('emptyState');

            if (!candidates || candidates.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = candidates.map(c => `
                <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 flex flex-col justify-between hover:border-slate-600 transition">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg text-indigo-300">${c.candidate_name || 'Unknown'}</h3>
                            <span class="bg-indigo-950 text-indigo-400 text-xs px-2.5 py-1 rounded-full border border-indigo-800 font-semibold">
                                ATS: ${c.ats_score || 0}
                            </span>
                        </div>
                        <p class="text-xs text-slate-400 mb-3">${c.email ? '📧 ' + c.email : 'No email'}</p>
                        <p class="text-xs text-slate-300 line-clamp-2 mb-4">${c.candidate_summary || 'No summary available'}</p>
                    </div>
                    <a href="/candidate-view/${c.id}" class="block text-center text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 rounded-lg font-medium transition">
                        View Analysis Profile →
                    </a>
                </div>
            `).join('');
        }

        function filterCandidates() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderCandidates(allCandidates);
                return;
            }

            const filtered = allCandidates.filter(c => {
                const name = (c.candidate_name || '').toLowerCase();
                const email = (c.email || '').toLowerCase();
                const summary = (c.candidate_summary || '').toLowerCase();
                const skills = String(c.extracted_skills || '').toLowerCase();
                
                return name.includes(query) || email.includes(query) || summary.includes(query) || skills.includes(query);
            });

            renderCandidates(filtered);
        }

        // Allow pressing Enter explicitly
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                filterCandidates();
            }
        });

        // Load on start
        document.addEventListener('DOMContentLoaded', loadCandidates);
    </script>
</body>
</html>
